components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGOUT
      - SIGN
      - APPROVE
      - REJECT
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `SIGN` - Electronic Signature
        * `APPROVE` - Approve
        * `REJECT` - Reject
    AuditLog:
      type: object
      description: |-
        Read-only serializer for displaying audit log entries.
        No create/update operations — audit logs are written
        exclusively by AuditService, never through the API.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        performed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        performed_by_name:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        model_name:
          type: string
          readOnly: true
          description: Name of the model that was changed. e.g. Batch, TestResult
        object_id:
          type: string
          readOnly: true
          description: UUID of the record that was changed.
        object_repr:
          type: string
          readOnly: true
          description: Human-readable representation of the record at time of change.
        old_value:
          readOnly: true
          nullable: true
          description: State of the record before the change.
        new_value:
          readOnly: true
          nullable: true
          description: State of the record after the change.
        ip_address:
          type: string
          readOnly: true
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Exact server time when this action occurred. Never editable.
        notes:
          type: string
          readOnly: true
          description: Optional context about why this change was made.
      required:
      - action
      - id
      - ip_address
      - model_name
      - new_value
      - notes
      - object_id
      - object_repr
      - old_value
      - performed_by
      - performed_by_name
